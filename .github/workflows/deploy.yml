name: Build and Deploy to Surge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js 20 avec cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Build du site
        run: |
          npm run build
          ls -lah dist/

      - name: Sauvegarder dist/ comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy-surge:
    runs-on: ubuntu-latest
    needs: build-site
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Recuperer l'artifact dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Surge
        run: npm install --global surge

      - name: Deployer sur Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN_RAW: ${{ secrets.SURGE_TOKEN }}
          SURGE_DOMAIN: ${{ secrets.SURGE_DOMAIN }}
        run: |
          export SURGE_TOKEN="$(echo -n "$SURGE_TOKEN_RAW" | sed 's/\x1b\[[0-9;]*m//g' | tr -d '[:space:]')"
          surge ./dist "$SURGE_DOMAIN"
